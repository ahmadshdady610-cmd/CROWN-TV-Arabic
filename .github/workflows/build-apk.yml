
name: Build CROWN TV APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

    
      - name: Extract project
        run: |
          unzip -o CROWN_TV_Arabic_Launcher_Project_v2.zip -d .
          FILE="app/src/main/java/com/crown/arabictv/CrownDreamService.kt"
          sed -i 's/runOnUiThread {/Handler(Looper.getMainLooper()).post {/g' "$FILE"
          grep -q '^import android.os.Handler$' "$FILE" || sed -i '/^package /a import android.os.Handler' "$FILE"
          grep -q '^import android.os.Looper$' "$FILE" || sed -i '/^package /a import android.os.Looper' "$FILE"
          rm -f .github/workflows/build-apk.yml
          test -f settings.gradle.kts
          

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crown-arabic-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
