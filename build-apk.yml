
name: Build CROWN TV APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract new project
        run: |
          echo "ZIP files found:"
          find . -type f -iname "*.zip"
          ZIP=$(find . -type f -iname "CROWN_TV_Arabic_From_Scratch.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: New project ZIP was not found"
            exit 1
          fi
          unzip -o "$ZIP" -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: crown-arabic-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
